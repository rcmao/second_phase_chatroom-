<!DOCTYPE html>
<html>
<head>
    <title>消息调试页面</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { border: 1px solid #ccc; margin: 10px 0; padding: 15px; border-radius: 5px; }
        .success { background: #e8f5e8; border-color: #4caf50; }
        .error { background: #ffeaea; border-color: #f44336; }
        .info { background: #e3f2fd; border-color: #2196f3; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; }
        .message { padding: 5px; margin: 2px 0; border-left: 3px solid #ccc; padding-left: 10px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>消息持久化调试工具</h1>
    
    <div class="section info">
        <h3>测试用户登录</h3>
        <input type="text" id="username" value="tester" placeholder="用户名">
        <input type="password" id="password" value="tester123" placeholder="密码">
        <button onclick="loginUser()">登录</button>
        <div id="loginResult"></div>
    </div>
    
    <div class="section info">
        <h3>消息数据对比</h3>
        <button onclick="compareMessages()">对比数据库和API</button>
        <div id="comparisonResult"></div>
    </div>
    
    <div class="section info">
        <h3>发送测试消息</h3>
        <input type="text" id="testMessage" value="调试测试消息" placeholder="消息内容">
        <button onclick="sendTestMessage()">发送消息</button>
        <div id="sendResult"></div>
    </div>
    
    <div class="section info">
        <h3>获取房间消息</h3>
        <input type="number" id="roomId" value="1" min="1" placeholder="房间ID">
        <button onclick="getMessages()">获取消息</button>
        <div id="messagesResult"></div>
    </div>
    
    <div class="section info">
        <h3>localStorage状态</h3>
        <button onclick="checkLocalStorage()">检查存储</button>
        <button onclick="clearStorage()">清空存储</button>
        <div id="storageResult"></div>
    </div>
    
    <script>
        let currentToken = null;
        let currentUser = null;
        
        function log(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            container.appendChild(div);
        }
        
        async function loginUser() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');
            resultDiv.innerHTML = '';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentToken = data.token;
                    currentUser = data.user;
                    localStorage.setItem('token', currentToken);
                    
                    log('loginResult', `✅ 登录成功！用户: ${currentUser.username}, ID: ${currentUser.id}`, 'success');
                    log('loginResult', `Token: ${currentToken.substring(0, 50)}...`, 'info');
                } else {
                    const errorText = await response.text();
                    log('loginResult', `❌ 登录失败: ${response.status} - ${errorText}`, 'error');
                }
            } catch (error) {
                log('loginResult', `❌ 登录错误: ${error}`, 'error');
            }
        }
        
        async function compareMessages() {
            const resultDiv = document.getElementById('comparisonResult');
            resultDiv.innerHTML = '';
            
            if (!currentToken) {
                log('comparisonResult', '❌ 请先登录', 'error');
                return;
            }
            
            try {
                // 获取API消息
                const apiResponse = await fetch('/api/rooms/1/messages', {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`
                    }
                });
                
                if (apiResponse.ok) {
                    const apiMessages = await apiResponse.json();
                    log('comparisonResult', `📊 API返回消息数: ${apiMessages.length}`, 'info');
                    
                    // 统计各用户消息数
                    const userCounts = {};
                    apiMessages.forEach(msg => {
                        userCounts[msg.author] = (userCounts[msg.author] || 0) + 1;
                    });
                    
                    log('comparisonResult', `👥 用户消息统计: ${JSON.stringify(userCounts)}`, 'info');
                    
                    // 显示最近5条消息
                    log('comparisonResult', '📝 最近5条消息:', 'info');
                    apiMessages.slice(-5).forEach((msg, index) => {
                        log('comparisonResult', `${index + 1}. [${msg.author}] ${msg.content} (${msg.timestamp})`, 'message');
                    });
                } else {
                    log('comparisonResult', `❌ API请求失败: ${apiResponse.status}`, 'error');
                }
                
                // 获取数据库信息
                const dbResponse = await fetch('/test_db_messages');
                if (dbResponse.ok) {
                    const dbInfo = await dbResponse.text();
                    log('comparisonResult', `🗄️ 数据库信息: ${dbInfo}`, 'info');
                }
                
            } catch (error) {
                log('comparisonResult', `❌ 比较失败: ${error}`, 'error');
            }
        }
        
        async function sendTestMessage() {
            const message = document.getElementById('testMessage').value;
            const resultDiv = document.getElementById('sendResult');
            resultDiv.innerHTML = '';
            
            if (!currentToken) {
                log('sendResult', '❌ 请先登录', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/rooms/1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({
                        content: `${message} - ${new Date().toLocaleTimeString()}`
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log('sendResult', `✅ 消息发送成功! ID: ${result.id}, 内容: ${result.content}`, 'success');
                } else {
                    const errorText = await response.text();
                    log('sendResult', `❌ 发送失败: ${response.status} - ${errorText}`, 'error');
                }
            } catch (error) {
                log('sendResult', `❌ 发送错误: ${error}`, 'error');
            }
        }
        
        async function getMessages() {
            const roomId = document.getElementById('roomId').value;
            const resultDiv = document.getElementById('messagesResult');
            resultDiv.innerHTML = '';
            
            if (!currentToken) {
                log('messagesResult', '❌ 请先登录', 'error');
                return;
            }
            
            try {
                log('messagesResult', `🔄 正在获取房间${roomId}的消息...`, 'info');
                
                const response = await fetch(`/api/rooms/${roomId}/messages`, {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Cache-Control': 'no-cache'
                    }
                });
                
                log('messagesResult', `📡 API响应状态: ${response.status}`, 'info');
                
                if (response.ok) {
                    const messages = await response.json();
                    log('messagesResult', `✅ 获取到 ${messages.length} 条消息`, 'success');
                    
                    if (messages.length === 0) {
                        log('messagesResult', '📝 房间中暂无消息', 'info');
                    } else {
                        messages.forEach((msg, index) => {
                            const timeStr = new Date(msg.timestamp).toLocaleString();
                            log('messagesResult', `${index + 1}. [${msg.author}] ${msg.content} (${timeStr})`, 'message');
                        });
                    }
                } else {
                    const errorText = await response.text();
                    log('messagesResult', `❌ 获取失败: ${response.status} - ${errorText}`, 'error');
                }
            } catch (error) {
                log('messagesResult', `❌ 获取错误: ${error}`, 'error');
            }
        }
        
        function checkLocalStorage() {
            const resultDiv = document.getElementById('storageResult');
            resultDiv.innerHTML = '';
            
            const token = localStorage.getItem('token');
            const userData = localStorage.getItem('user');
            
            log('storageResult', `🔑 Token: ${token ? token.substring(0, 50) + '...' : '无'}`, 'info');
            log('storageResult', `👤 用户数据: ${userData || '无'}`, 'info');
            
            // 检查token是否有效
            if (token) {
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    const exp = new Date(payload.exp * 1000);
                    const now = new Date();
                    
                    if (exp > now) {
                        log('storageResult', `⏰ Token有效期至: ${exp.toLocaleString()}`, 'success');
                    } else {
                        log('storageResult', `⚠️ Token已过期: ${exp.toLocaleString()}`, 'error');
                    }
                } catch (e) {
                    log('storageResult', `❌ Token格式错误`, 'error');
                }
            }
        }
        
        function clearStorage() {
            localStorage.clear();
            currentToken = null;
            currentUser = null;
            log('storageResult', '🗑️ 存储已清空', 'info');
        }
        
        // 页面加载时检查现有状态
        window.onload = function() {
            const savedToken = localStorage.getItem('token');
            if (savedToken) {
                currentToken = savedToken;
                checkLocalStorage();
            }
        };
    </script>
</body>
</html>
