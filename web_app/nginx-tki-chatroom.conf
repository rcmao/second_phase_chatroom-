# TKI Smart Chatroom Nginx Configuration
# Place this file in /etc/nginx/sites-available/ and create a symlink to /etc/nginx/sites-enabled/

upstream tki_chatroom_backend {
    # Gunicorn服务器地址
    server 127.0.0.1:8090 fail_timeout=0;
    
    # 如果有多个Gunicorn实例，可以添加更多服务器实现负载均衡
    # server 127.0.0.1:8091 fail_timeout=0;
    # server 127.0.0.1:8092 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    
    # 替换为你的域名，如果没有域名可以使用服务器IP
    server_name your-domain.com;
    
    # 根目录
    root /root/first_phase_chatroom_v1/web_app;
    
    # 日志文件
    access_log /var/log/nginx/tki-chatroom-access.log;
    error_log /var/log/nginx/tki-chatroom-error.log;
    
    # 客户端上传文件大小限制
    client_max_body_size 64M;
    
    # 静态文件处理
    location /static/ {
        alias /root/first_phase_chatroom_v1/web_app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN";
    }
    
    # 媒体文件处理（如果有）
    location /media/ {
        alias /root/first_phase_chatroom_v1/web_app/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Socket.IO WebSocket连接
    location /socket.io/ {
        proxy_pass http://tki_chatroom_backend;
        proxy_redirect off;
        proxy_buffering off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket相关设置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    
    # API接口
    location /api/ {
        proxy_pass http://tki_chatroom_backend;
        proxy_redirect off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # 主应用
    location / {
        try_files $uri @app;
    }
    
    location @app {
        proxy_pass http://tki_chatroom_backend;
        proxy_redirect off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # 健康检查
    location /health {
        proxy_pass http://tki_chatroom_backend;
        access_log off;
    }
    
    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}

